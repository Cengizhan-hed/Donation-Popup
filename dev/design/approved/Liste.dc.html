<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bağış listesi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#14213D;text-decoration:none}a:hover{color:#12305A}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F6F2EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column">
<div style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800">Bağışlar</h1>
<div style="display: flex; gap: 8px; overflow: hidden">
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: {{brand}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">Tümü</button>
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #D5D9E0; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Kurban</button>
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #D5D9E0; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Su Kuyusu</button>
<button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #D5D9E0; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 14px; font-weight: 600; white-space: nowrap">Eğitim</button>
</div>
</div>
<div style="padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px">
<article style="background: #FFFFFF; border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,33,61,0.06), 0 8px 24px rgba(20,33,61,0.06)">
<a href="#" style="display: block; height: 150px; background: #E9E2D8; position: relative">
<span style="position: absolute; top: 12px; left: 12px; font-size: 11.5px; font-weight: 700; color: #FFFFFF; background: {{accent}}; padding: 4px 10px; border-radius: 999px">KAMPANYA · 18 GÜN</span>
<span style="position: absolute; bottom: 12px; left: 12px; font-size: 12px; font-weight: 600; color: #5A4E3E; background: rgba(255,255,255,0.85); padding: 4px 10px; border-radius: 999px">Kampanya görseli</span>
</a>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<a href="#" style="font-size: 17px; font-weight: 800">Su Kuyusu Kampanyası</a>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 8px; border-radius: 4px; background: #EDE7DF; overflow: hidden"><div style="width: 62%; height: 100%; background: {{brand}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12.5px; color: #5B6475"><span><b style="color: #14213D">₺184.500</b> / ₺300.000</span><span>412 bağışçı</span></div>
</div>
<button style="height: 50px; border-radius: 14px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">Bağış yap</button>
</div>
</article>
<article style="background: #FFFFFF; border-radius: 22px; overflow: hidden; display: flex; box-shadow: 0 1px 2px rgba(20,33,61,0.06), 0 8px 24px rgba(20,33,61,0.06)">
<a href="#" aria-label="Adak Kurbanı" style="display: block; width: 116px; background: #E9E2D8; flex: none"></a>
<div style="padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px">
<a href="#" style="font-size: 16px; font-weight: 800">Adak Kurbanı</a>
<span style="font-size: 12.5px; color: #5B6475">Hisse başı · 24 saatte video</span>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<span style="font-size: 17px; font-weight: 800">₺6.000</span>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">Bağışla</button>
</div>
</div>
</article>
<article style="background: #FFFFFF; border-radius: 22px; overflow: hidden; display: flex; box-shadow: 0 1px 2px rgba(20,33,61,0.06), 0 8px 24px rgba(20,33,61,0.06)">
<a href="#" aria-label="Genel Bağış" style="display: block; width: 116px; background: #DCE3EC; flex: none"></a>
<div style="padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px">
<a href="#" style="font-size: 16px; font-weight: 800">Genel Bağış</a>
<span style="font-size: 12.5px; color: #5B6475">İhtiyacın en çok olduğu yere</span>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<span style="font-size: 14px; font-weight: 600; color: #5B6475">İstediğiniz tutar</span>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">Bağışla</button>
</div>
</div>
</article>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
