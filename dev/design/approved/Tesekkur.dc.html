<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Teşekkür</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12305A}a:hover{color:#0B1F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F2EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 16px">
<div style="width: 88px; height: 88px; border-radius: 44px; background: {{brand}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(18,48,90,0.10), 0 0 0 22px rgba(18,48,90,0.05)">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
<h1 style="margin: 14px 0 0; font-size: 26px; font-weight: 800; line-height: 1.2">Allah kabul etsin, Ayşe Hanım</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3E4A5E">Bağışınız alındı. Su kuyusu çalışmasından fotoğraf ve videoyu telefonunuza göndereceğiz.</p>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5B6475">Bağış</span><span style="font-weight: 700">Su Kuyusu Kampanyası</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5B6475">Tutar</span><span style="font-weight: 800">₺1.000</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5B6475">Bağış no</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">#24817</span></div>
<div style="height: 1px; background: #EEF0F3"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Kampanyaya katkınız</span><span style="font-weight: 700; color: #12305A">%62 → %63</span></div>
<div style="height: 10px; border-radius: 5px; background: #EDE7DF; overflow: hidden; display: flex"><div style="width: 62%; height: 100%; background: {{brand}}"></div><div style="width: 1%; height: 100%; background: {{accent}}"></div></div>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; gap: 12px; align-items: center">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #EEF3FA; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Bağışlarınızı takip edin</span><span style="font-size: 12.5px; color: #5B6475">Tek dokunuşla hesap açın, tüm bağışlarınız bir yerde.</span></div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button style="height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Bir bağış daha yap</button>
<button style="height: 50px; border-radius: 14px; border: 1.5px solid #D5D9E0; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"></path></svg>Kampanyayı paylaş</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
