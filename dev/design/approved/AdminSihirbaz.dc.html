<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kurulum sihirbazı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12305A}a:hover{color:#0B1F3B}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; box-sizing: border-box; background: #F3F4F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D; display: flex; flex-direction: column; align-items: center; padding: 32px 0">
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 22px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1E6B45"><span style="width: 26px; height: 26px; border-radius: 13px; background: #E5F3EB; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Sayfalar</span>
<span style="width: 32px; height: 2px; background: #C3C4C7; display: block"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: {{brand}}"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{brand}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px">2</span>Görünüm</span>
<span style="width: 32px; height: 2px; background: #C3C4C7; display: block"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #50575E"><span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C4C7; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px">3</span>Bağış formu</span>
<span style="width: 32px; height: 2px; background: #C3C4C7; display: block"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #50575E"><span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C4C7; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px">4</span>Modüller</span>
<span style="width: 32px; height: 2px; background: #C3C4C7; display: block"></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #50575E"><span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #C3C4C7; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px">5</span>Bitir</span>
</div>
<div style="width: 1040px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.05), 0 18px 48px rgba(20,33,61,0.08); display: grid; grid-template-columns: 1fr 340px; overflow: hidden; flex: 1; min-height: 0">
<div style="padding: 32px 36px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 800">Bağış formu nasıl açılsın?</h1><span style="font-size: 14.5px; color: #50575E">Bağışçı "Bağış yap"a dokunduğunda formun nasıl görüneceğini seçin. Sonradan her ürün için ayrıca değiştirebilirsiniz.</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px">
<button style="text-align: left; padding: 14px; border-radius: 18px; border: 2px solid {{brand}}; background: #EEF3FA; font-family: inherit; color: #14213D; display: flex; flex-direction: column; gap: 12px">
<span style="height: 96px; border-radius: 12px; background: #DCE3EC; position: relative; display: block; overflow: hidden"><span style="position: absolute; top: 14px; right: 0; bottom: 0; width: 44%; background: #FFFFFF; border-radius: 10px 0 0 10px; display: block"></span></span>
<span style="font-size: 14.5px; font-weight: 800">Sağ panel</span><span style="font-size: 12.5px; color: #3E4A5E">Önerilen · mobilde alttan açılır</span>
</button>
<button style="text-align: left; padding: 14px; border-radius: 18px; border: 1.5px solid #DDE1E7; background: #FFFFFF; font-family: inherit; color: #14213D; display: flex; flex-direction: column; gap: 12px">
<span style="height: 96px; border-radius: 12px; background: #E6E9EE; position: relative; display: block"><span style="position: absolute; top: 18px; left: 22%; right: 22%; bottom: 18px; background: #FFFFFF; border-radius: 10px; display: block"></span></span>
<span style="font-size: 14.5px; font-weight: 800">Ortada pencere</span><span style="font-size: 12.5px; color: #50575E">Kısa formlar için</span>
</button>
<button style="text-align: left; padding: 14px; border-radius: 18px; border: 1.5px solid #DDE1E7; background: #FFFFFF; font-family: inherit; color: #14213D; display: flex; flex-direction: column; gap: 12px">
<span style="height: 96px; border-radius: 12px; background: #E6E9EE; display: flex; flex-direction: column; gap: 6px; padding: 12px; box-sizing: border-box"><span style="height: 10px; width: 60%; border-radius: 5px; background: #C9CED6; display: block"></span><span style="flex: 1; border-radius: 8px; background: #FFFFFF; display: block"></span></span>
<span style="font-size: 14.5px; font-weight: 800">Sayfa içinde</span><span style="font-size: 12.5px; color: #50575E">Form sayfada açık durur</span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 800">Renkler</span>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 2px solid {{brand}}; background: #EEF3FA; font-size: 14px"><input type="radio" name="renk" checked style="width: 20px; height: 20px; accent-color: #12305A"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">Temamın renklerini kullan</span><span style="font-size: 12.5px; color: #3E4A5E">Form sitenizin renk ve yazı tipine kendiliğinden uyar</span></span><span style="display: flex; gap: 6px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #12305A; display: block"></span><span style="width: 22px; height: 22px; border-radius: 11px; background: #C2511C; display: block"></span></span></label>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1.5px solid #DDE1E7; font-size: 14px"><input type="radio" name="renk" style="width: 20px; height: 20px; accent-color: #12305A"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">Kendi renklerimi seçeyim</span><span style="font-size: 12.5px; color: #50575E">Ana renk ve düğme rengi</span></span></label>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between">
<button style="height: 48px; padding: 0 20px; border-radius: 14px; border: 1.5px solid #C3C4C7; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #14213D">Geri</button>
<button style="height: 48px; padding: 0 24px; border-radius: 14px; border: 0; background: {{accent}}; font-family: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF">Devam et</button>
</div>
</div>
<div style="background: #F6F2EC; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="font-size: 12px; font-weight: 700; color: #5A4E3E; letter-spacing: 0.06em">CANLI ÖNİZLEME</span>
<div style="width: 220px; flex: 1; border-radius: 30px; background: #2A3142; padding: 10px; box-sizing: border-box; position: relative; overflow: hidden">
<div style="position: absolute; left: 10px; right: 10px; bottom: 10px; top: 120px; background: #FFFFFF; border-radius: 20px 20px 22px 22px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px">
<span style="width: 30px; height: 4px; border-radius: 2px; background: #D5D9E0; align-self: center; display: block"></span>
<span style="height: 10px; width: 70%; border-radius: 5px; background: #14213D; display: block"></span>
<span style="height: 6px; border-radius: 3px; background: #EDE7DF; display: block"><span style="width: 62%; height: 100%; border-radius: 3px; background: {{brand}}; display: block"></span></span>
<span style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><span style="height: 34px; border-radius: 9px; border: 1.5px solid #DDE1E7; display: block"></span><span style="height: 34px; border-radius: 9px; border: 1.5px solid #DDE1E7; display: block"></span><span style="height: 34px; border-radius: 9px; border: 2px solid {{brand}}; background: #EEF3FA; display: block"></span><span style="height: 34px; border-radius: 9px; border: 1.5px solid #DDE1E7; display: block"></span></span>
<span style="margin-top: auto; height: 34px; border-radius: 10px; background: {{accent}}; display: block"></span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
