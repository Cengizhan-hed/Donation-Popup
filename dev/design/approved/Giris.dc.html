<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Giriş ve kayıt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12305A}a:hover{color:#0B1F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A3142; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 64px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; opacity: 0.55">
<span style="font-size: 18px; font-weight: 800; color: #12305A">Site logosu</span>
<span style="display: flex; gap: 8px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #EEF3FA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
<span style="width: 44px; height: 44px; border-radius: 22px; background: #F1F3F6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h2l2 11h10l2-8H7"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg></span>
</span>
</div>
<div style="position: absolute; top: 150px; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding: 10px 20px 24px; box-sizing: border-box; gap: 16px">
<div style="display: flex; justify-content: center"><span style="width: 44px; height: 5px; border-radius: 3px; background: #D5D9E0; display: block"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Hoş geldiniz</h1>
<p style="margin: 0; font-size: 14px; color: #5B6475; line-height: 1.5">Giriş yapın; bağışlarınızı, makbuzlarınızı ve videolarınızı tek yerden görün.</p>
</div>
<div role="tablist" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: #F1F3F6">
<button role="tab" aria-selected="true" style="height: 44px; border-radius: 11px; border: 0; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,33,61,0.12); font-family: inherit; font-size: 14px; font-weight: 700; color: #14213D">Giriş yap</button>
<button role="tab" aria-selected="false" style="height: 44px; border-radius: 11px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #5B6475">Hesap oluştur</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">E-posta
<input type="email" placeholder="ornek@eposta.com" style="height: 52px; border-radius: 14px; border: 1.5px solid #DDE1E7; padding: 0 14px; font-family: inherit; font-size: 15px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Şifre
<span style="display: flex; height: 52px; border-radius: 14px; border: 1.5px solid #DDE1E7; align-items: center; padding-right: 4px">
<input type="password" value="12345678" style="border: 0; outline: none; flex: 1; padding: 0 14px; font-family: inherit; font-size: 15px; background: transparent">
<button aria-label="Şifreyi göster" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span>
</label>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px; color: #3E4A5E"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #12305A">Beni hatırla</label>
<a href="#" style="font-weight: 600">Şifremi unuttum</a>
</div>
<button style="height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Giriş yap</button>
<div style="flex: 1"></div>
<div style="padding: 14px; border-radius: 16px; background: #F6F2EC; display: flex; gap: 12px; align-items: flex-start">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="font-size: 12.5px; color: #3E4A5E; line-height: 1.5">Daha önce bu e-postayla yaptığınız bağışlar, e-postanızı doğruladığınızda hesabınıza otomatik eklenir.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
