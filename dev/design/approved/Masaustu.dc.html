<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Masaüstü sağ panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12305A}a:hover{color:#0B1F3B}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #F6F2EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D">
<div style="position: absolute; inset: 0; padding: 40px 64px; box-sizing: border-box; display: flex; gap: 48px">
<div style="width: 460px; height: 460px; border-radius: 24px; background: #E9E2D8"></div>
<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 20px">
<span style="font-size: 13px; color: #5B6475">Ürün sayfası (temanın kendi tasarımı)</span>
<span style="font-size: 34px; font-weight: 800">Adak Kurbanı</span>
<span style="font-size: 24px; font-weight: 700">₺6.000</span>
</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(20,28,45,0.45)"></div>
<aside aria-label="Bağış paneli" style="position: absolute; top: 0; right: 0; bottom: 0; width: 460px; background: #FFFFFF; box-shadow: -16px 0 48px rgba(10,20,40,0.22); display: flex; flex-direction: column">
<div style="padding: 24px 28px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 24px; font-weight: 800">Adak Kurbanı</h2>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #12305A; background: #EEF3FA; padding: 5px 10px; border-radius: 999px; align-self: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 10l4.5-2.5v9L15 14M4 7h11v10H4z"></path></svg>24 saat içinde kesim videosu</span>
</div>
<button aria-label="Kapat" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F1F3F6; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="padding: 22px 28px; flex: 1; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Hisse sayısı</span>
<div style="display: flex; align-items: center; gap: 14px">
<div style="display: flex; align-items: center; height: 56px; border-radius: 16px; border: 1.5px solid #DDE1E7">
<button aria-label="Azalt" style="width: 56px; height: 54px; border: 0; background: transparent; font-size: 22px; color: #14213D">−</button>
<span style="width: 40px; text-align: center; font-size: 18px; font-weight: 800">2</span>
<button aria-label="Artır" style="width: 56px; height: 54px; border: 0; background: transparent; font-size: 22px; color: #14213D">+</button>
</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #5B6475">₺6.000 × 2 hisse</span><span style="font-size: 22px; font-weight: 800">₺12.000</span></div>
</div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; grid-column: 1 / -1">Ad soyad
<input type="text" placeholder="Adınız ve soyadınız" style="height: 50px; border-radius: 14px; border: 1.5px solid #DDE1E7; padding: 0 14px; font-family: inherit; font-size: 15px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; grid-column: 1 / -1">Telefon
<span style="display: flex; height: 50px; border-radius: 14px; border: 1.5px solid #DDE1E7; overflow: hidden"><span style="display: flex; align-items: center; padding: 0 12px; background: #F6F7F9; border-right: 1px solid #DDE1E7; font-size: 15px; font-weight: 600">+90</span><input type="tel" placeholder="5xx xxx xx xx" style="border: 0; outline: none; flex: 1; padding: 0 14px; font-family: inherit; font-size: 15px"></span>
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Kurban kimin adına kesilsin?
<input type="text" placeholder="Örn. Ahmet Yılmaz ve ailesi" style="height: 50px; border-radius: 14px; border: 1.5px solid #DDE1E7; padding: 0 14px; font-family: inherit; font-size: 15px">
</label>
<div style="display: flex; gap: 16px; padding: 14px 16px; border-radius: 16px; background: #F6F2EC; font-size: 12.5px; color: #3E4A5E">
<span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Güvenli ödeme</span>
<span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Resmî dernek</span>
<span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12305A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 10l4.5-2.5v9L15 14M4 7h11v10H4z"></path></svg>Videolu bilgilendirme</span>
</div>
</div>
<div style="padding: 18px 28px 26px; border-top: 1px solid #EEF0F3; display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px">
<button style="height: 56px; border-radius: 16px; border: 1.5px solid #D5D9E0; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 15px; font-weight: 600">Sepete ekle</button>
<button style="height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">₺12.000 bağışla</button>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
