</div>

<span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: #1E6B45; background: #E5F3EB; padding: 4px 10px; border-radius: 999px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #1E6B45; display: block"></span>Kesildi · video hazır</span>

<button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; font-family: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF">Tekrarla</button>
</div>
</article>
<article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 52px; height: 52px; border-radius: 12px; background: #DCE3EC; flex: none"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 700">Su Kuyusu Kampanyası</span><span style="font-size: 12px; color: #5B6475">2 Ekim · tek seferlik</span></div>
<span style="font-size: 15px; font-weight: 800">₺1.000</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12.5px"><span style="font-weight: 600; color: #3E4A5E">Kampanya ilerlemesi</span><span style="font-weight: 700; color: #12305A">%62</span></div>
<div style="height: 8px; border-radius: 4px; background: #EDE7DF; overflow: hidden"><div style="width: 62%; height: 100%; background: {{brand}}"></div></div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button style="height: 44px; border-radius: 12px; border: 1.5px solid #D5D9E0; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #14213D">Makbuz</button>
<button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; font-family: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF">Tekrar bağışla</button>
</div>

</div>
<nav aria-label="Hesap menüsü" style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 8px 14px">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
