<x-dc>
<helmet>

<div style="padding: 20px 18px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EEF0F3">

</div>
<div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1">

</div>
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 56px; height: 56px; border-radius: 14px; background: #DCE3EC; flex: none"></div>

<span style="font-size: 15px; font-weight: 800">₺1.000</span>
</div>
<div style="display: flex; gap: 12px; align-items: center">

<button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid {{brand}}; background: #FFFFFF; color: {{brand}}; font-family: inherit; font-size: 14px; font-weight: 700">+ ₺50</button>
