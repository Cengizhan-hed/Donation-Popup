<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bağışçı bilgileri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#12305A}a:hover{color:#0B1F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A3142; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14213D">
<div style="position: absolute; top: 52px; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 10px"><span style="width: 44px; height: 5px; border-radius: 3px; background: #D5D9E0; display: block"></span></div>
<div style="padding: 10px 20px 0; display: flex; align-items: center; gap: 12px">
<button aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F1F3F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<span style="font-size: 12px; font-weight: 600; color: #5B6475; letter-spacing: 0.04em">ADIM 2 / 2</span>
<h1 style="margin: 0; font-size: 21px; font-weight: 800">Bilgileriniz</h1>
</div>
</div>
<div style="margin: 14px 20px 0; display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: {{brand}}; display: block"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{brand}}; display: block"></span></div>
<div style="padding: 18px 20px 0; flex: 1; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F6F2EC">
<div style="width: 52px; height: 52px; border-radius: 12px; background: #E9E2D8"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Su Kuyusu Kampanyası</span><span style="font-size: 12.5px; color: #5B6475">Tek seferlik bağış</span></div>
<span style="font-size: 16px; font-weight: 800">₺1.000</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Ad soyad
<input type="text" value="Ayşe Yılmaz" style="height: 52px; border-radius: 14px; border: 1.5px solid #DDE1E7; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14213D">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Telefon
<span style="display: flex; height: 52px; border-radius: 14px; border: 2px solid {{brand}}; overflow: hidden">
<span style="display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #F6F7F9; border-right: 1px solid #DDE1E7; font-size: 15px; font-weight: 600">+90<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
<input type="tel" value="532 000 00 00" style="border: 0; outline: none; flex: 1; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14213D">
</span>
<span style="font-size: 12px; font-weight: 500; color: #5B6475">Bağış videonuzu ve bilgilendirmeleri bu numaraya göndeririz.</span>
</label>
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: {{brand}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Not ekle (isteğe bağlı)</button>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #3E4A5E; line-height: 1.45">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #12305A">
<span>Adımın bağışçı listesinde <b>anonim</b> görünmesini istiyorum</span>
</label>
</div>
<div style="padding: 14px 20px 22px; border-top: 1px solid #EEF0F3; display: flex; flex-direction: column; gap: 10px">
<button style="height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>₺1.000 bağışla</button>
<button style="height: 48px; border-radius: 14px; border: 1.5px solid #DDE1E7; background: #FFFFFF; color: #14213D; font-family: inherit; font-size: 14px; font-weight: 600">Sepete ekle, başka bağış seç</button>
<span style="text-align: center; font-size: 12px; color: #5B6475">Devam ederek <a href="#">aydınlatma metnini</a> okuduğunuzu kabul edersiniz.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2511C"},"brand":{"editor":"color","default":"#12305A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2511C', brand: this.props.brand ?? '#12305A' };
}
}
</script>
</body>
</html>
